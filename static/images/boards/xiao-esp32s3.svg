<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Seeed XIAO ESP32-S3 for the TinyGo Playground simulator. -->
<!-- PCB: 20.44×17.78mm. USB-C port centered at top. -->
<!-- Left pads (top→bottom):  D0 D1 D2 D3 D4 D5 D6 -->
<!-- Right pads (top→bottom): 5V GND 3V3 D10 D9 D8 D7 -->
<!-- LED (GPIO21) is an onboard indicator, not on a header pad. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 -1.3 20.44 19.08" width="20.44mm" height="19.08mm">

  <!-- PCB -->
  <rect x="0" y="0" width="20.44" height="17.78" fill="#1a1a1a"/>

  <!-- USB port -->
  <rect x="6.22" y="-1.3" width="8" height="6" fill="#ccc"/>

  <!-- onboard LED (GPIO21) -->
  <g data-part="led" transform="translate(14.64, 2.0)">
    <rect width="2.0" height="1.2" fill="black"/>
    <rect width="2.0" height="1.2" style="fill: var(--color, black); filter: drop-shadow(0 0 1px var(--shadow)) drop-shadow(0 0 1px var(--shadow));"/>
  </g>

  <!-- Simplified middle components -->
  <g id="middle-components">
    <!-- Main metallic shield -->
    <rect x="3.8" y="5.5" width="12.84" height="8.5" rx="0.5" fill="#ecebea" stroke="#808080" stroke-width="0.2"/>
    <circle cx="4.8" cy="6.5" r="0.4" fill="#808080" />
    <circle cx="15.64" cy="13.0" r="0.4" fill="#808080" />
  </g>

  <!-- pads on the left: D0 D1 D2 D3 D4 D5 D6 -->
  <g transform="translate(0, 0)" fill="transparent">
    <g data-pin="D0" transform="translate(0, 0)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D1" transform="translate(0, 2.54)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D2" transform="translate(0, 5.08)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D3" transform="translate(0, 7.62)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D4" transform="translate(0, 10.16)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D5" transform="translate(0, 12.7)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D6" transform="translate(0, 15.24)">
      <path transform="translate(0, 0.47)" d="M 0,0 V 1.6 H 1.61 A 0.8 0.8 0 0 0 1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
  </g>

  <!-- pads on the right: 5V GND 3V3 D10 D9 D8 D7 -->
  <g transform="translate(17.22, 0)" fill="transparent">
    <g data-pin="5V" data-title="5V" transform="translate(0, 0)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="GND#1" data-title="GND" transform="translate(0, 2.54)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="3V3" data-title="3V3" transform="translate(0, 5.08)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D10" transform="translate(0, 7.62)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D9" transform="translate(0, 10.16)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D8" transform="translate(0, 12.7)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
    <g data-pin="D7" transform="translate(0, 15.24)">
      <path transform="translate(3.22, 0.47)" d="M 0,0 V 1.6 H -1.61 A 0.8 0.8 0 0 1 -1.61 0 Z" fill="#d4af37"/>
      <rect width="3.22" height="2.54" class="area"/>
    </g>
  </g>
</svg>
